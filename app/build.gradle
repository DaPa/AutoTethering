plugins {
    id 'com.android.application'
}

android {
    namespace = "io.github.dapa.autotethering"

    //noinspection GradleDependency
    compileSdk 37

    defaultConfig {
        applicationId "io.github.dapa.autotethering"
        minSdk 36
        //noinspection OldTargetApi
        targetSdk 36
        versionCode = 2
        versionName = "2.0.1"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    signingConfigs {
        release {
            // Path relative to module
            storeFile file("keystore/my_keystore-release.jks")

            // Use environment variables (important for CI)
            storePassword System.getenv("KEYSTORE_PASSWORD")
            keyAlias System.getenv("KEY_ALIAS")
            keyPassword System.getenv("KEY_PASSWORD")
        }
    }

    buildTypes {
        release {
            // Enable signing
            signingConfig = signingConfigs.release

            // Optimize APK
            minifyEnabled true
            shrinkResources = true

            // ProGuard config
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'),
                          'proguard-rules.pro'
        }
    }

    buildFeatures {
        buildConfig = true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }
}

androidComponents {
    onVariants(selector().all()) { variant ->
        variant.outputs.forEach { output ->

            def versionNameValue = output.versionName.orElse("dev").get()
            def variantName = variant.name

            output.outputFileName.set(
                    "AutoTethering-${variantName}-v${versionNameValue}.apk"
            )
        }
    }
}

dependencies {

    implementation "org.jetbrains.kotlin:kotlin-stdlib:$kotlin_version"
    //noinspection GradleDependency
    implementation 'androidx.core:core-ktx:1.19.0'
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'com.google.android.material:material:1.14.0'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.7.0'
}
